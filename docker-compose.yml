services:
  app:
    build: ./app
    container_name: devops-node-app
    ports:
      - "3000:3000"
    environment:
      - APP_NAME=Docker DevOps Microservice
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: devops-postgres-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=devopsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: